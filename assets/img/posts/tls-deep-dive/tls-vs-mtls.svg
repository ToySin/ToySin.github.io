<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>TLS는 클라이언트만 서버 인증서를 검증하고, mTLS는 서버도 Client CA로 클라이언트 인증서를 검증한다</title>
  <defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
  <rect x="0" y="0" width="960" height="370" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="470" y1="36" x2="470" y2="340" stroke="#e2e8f0" stroke-width="2"/>

  <!-- TLS -->
  <text x="40" y="56" font-size="22" font-weight="700" fill="#0f172a">TLS</text>
  <text x="40" y="82" font-size="15" fill="#64748b">클라이언트가 서버만 확인한다</text>
  <rect x="50" y="140" width="130" height="64" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="115" y="178" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">클라이언트</text>
  <rect x="300" y="140" width="130" height="64" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="365" y="178" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">서버</text>
  <line x1="298" y1="172" x2="184" y2="172" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="241" y="160" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">서버 인증서</text>
  <text x="115" y="236" font-size="14" fill="#15803d" text-anchor="middle">✓ Root CA로 검증</text>

  <!-- mTLS -->
  <text x="500" y="56" font-size="22" font-weight="700" fill="#0f172a">mTLS (mutual TLS)</text>
  <text x="500" y="82" font-size="15" fill="#64748b">서로 확인한다 — 붙는 클라이언트가 정해져 있을 때</text>
  <rect x="510" y="140" width="130" height="64" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="575" y="178" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">클라이언트</text>
  <rect x="790" y="140" width="130" height="64" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="855" y="178" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">서버</text>
  <line x1="788" y1="158" x2="644" y2="158" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="715" y="146" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">서버 인증서</text>
  <line x1="642" y1="188" x2="786" y2="188" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-dark)"/>
  <text x="715" y="214" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">클라이언트 인증서</text>
  <g font-size="14" text-anchor="middle">
    <text x="575" y="250" fill="#15803d">✓ Root CA로 서버 검증</text>
    <text x="575" y="274" fill="#64748b">인증서: Vault 키로 서명</text>
    <text x="855" y="250" fill="#15803d">✓ Client CA로 클라 검증</text>
    <text x="855" y="274" fill="#64748b">Client CA = Vault 인증서</text>
  </g>
  <text x="500" y="324" font-size="14" fill="#334155">서버는 client CA를 추가로 가지고 있어야 한다</text>
</svg>
