<rect x="240" y="104" width="320" height="44" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="400.0" y="131" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">net.Conn 객체, 송수신할 데이터</text>
<rect x="240" y="200" width="280" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="380.0" y="227" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">fd 테이블 · 파일 객체 · 소켓 객체</text>
<rect x="540" y="200" width="170" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="625.0" y="227" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">TCP 연결별 상태</text>
