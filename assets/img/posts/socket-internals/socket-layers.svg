<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<title>소켓의 위치: 사용자 메모리의 net.Conn, 커널의 fd·소켓·TCP 상태·버퍼, 하드웨어의 NIC</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect x="0" y="0" width="960" height="430" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="30" y="46" font-size="22" font-weight="700" fill="#0f172a">소켓은 어디에 있나</text>
<text x="30" y="72" font-size="15" fill="#64748b">프로세스는 fd로 소켓을 가리키고, 실제 상태와 버퍼는 커널이 관리한다</text>
<rect x="30" y="92" width="900" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="30" y="182" width="900" height="150" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5"/>
