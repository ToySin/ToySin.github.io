<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>chroot와 pivot_root 비교</title>
  <defs>
    <marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>

  <!-- card background so the figure reads the same in light and dark themes -->
  <rect x="0" y="0" width="960" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="470" y1="36" x2="470" y2="396" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== chroot ===== -->
  <text x="50" y="60" font-size="22" font-weight="700" fill="#0f172a">chroot</text>
  <text x="50" y="86" font-size="14" fill="#64748b">프로세스에게 루트를 "속인다"</text>

  <rect x="50" y="110" width="390" height="230" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="66" y="134" font-size="14" font-weight="700" fill="#334155">호스트 루트 파일시스템 /</text>
  <g font-size="12" fill="#475569">
    <rect x="66" y="150" width="50" height="26" rx="5" fill="#f1f5f9"/><text x="91" y="167" text-anchor="middle">bin</text>
    <rect x="124" y="150" width="50" height="26" rx="5" fill="#f1f5f9"/><text x="149" y="167" text-anchor="middle">lib</text>
    <rect x="182" y="150" width="50" height="26" rx="5" fill="#f1f5f9"/><text x="207" y="167" text-anchor="middle">proc</text>
    <rect x="240" y="150" width="50" height="26" rx="5" fill="#f1f5f9"/><text x="265" y="167" text-anchor="middle">…</text>
  </g>

  <rect x="66" y="196" width="220" height="128" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="219" font-size="14" font-weight="700" fill="#1d4ed8">myroot/</text>
  <g font-size="12" fill="#1e3a8a">
    <rect x="80" y="232" width="70" height="26" rx="5" fill="#dbeafe"/><text x="115" y="249" text-anchor="middle">bin/sh</text>
    <rect x="158" y="232" width="50" height="26" rx="5" fill="#dbeafe"/><text x="183" y="249" text-anchor="middle">lib</text>
  </g>
  <text x="80" y="306" font-size="12" fill="#2563eb">프로세스가 보는 /</text>

  <rect x="314" y="280" width="110" height="36" rx="18" fill="#1e293b"/>
  <text x="369" y="303" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">프로세스</text>
  <text x="369" y="270" font-size="12" fill="#334155" text-anchor="middle">"너의 루트는 여기야~"</text>
  <line x1="314" y1="298" x2="290" y2="298" stroke="#1e293b" stroke-width="2" marker-end="url(#a-dark)"/>

  <path d="M286,206 C380,206 420,190 420,146" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-red)"/>
  <text x="300" y="232" font-size="12" fill="#dc2626">chdir("..") 반복</text>
  <text x="300" y="248" font-size="12" fill="#dc2626">→ 진짜 / 로 탈옥</text>

  <text x="50" y="372" font-size="14" font-weight="700" fill="#dc2626">✗ 실제 루트 파일시스템은 그대로 → 탈옥 가능</text>
  <text x="50" y="396" font-size="13" fill="#64748b">sudo 권한이 필요해서 권한 제한으로 1차 방어</text>

  <!-- ===== pivot_root ===== -->
  <text x="500" y="60" font-size="22" font-weight="700" fill="#0f172a">pivot_root</text>
  <text x="500" y="86" font-size="14" fill="#64748b">루트 파일시스템을 실제로 바꾼다</text>

  <rect x="500" y="110" width="430" height="230" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="516" y="132" font-size="12" font-weight="700" fill="#7c3aed">마운트 네임스페이스 (unshare --mount)</text>

  <rect x="516" y="144" width="262" height="180" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="167" font-size="14" font-weight="700" fill="#15803d">/  (= new_root)</text>
  <g font-size="12" fill="#14532d">
    <rect x="530" y="178" width="50" height="26" rx="5" fill="#dcfce7"/><text x="555" y="195" text-anchor="middle">bin</text>
    <rect x="588" y="178" width="50" height="26" rx="5" fill="#dcfce7"/><text x="613" y="195" text-anchor="middle">lib</text>
    <rect x="646" y="178" width="50" height="26" rx="5" fill="#dcfce7"/><text x="671" y="195" text-anchor="middle">…</text>
  </g>
  <rect x="530" y="218" width="234" height="90" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="544" y="241" font-size="13" font-weight="700" fill="#334155">put_old/</text>
  <text x="544" y="263" font-size="12" fill="#64748b">기존 호스트 루트가</text>
  <text x="544" y="281" font-size="12" fill="#64748b">여기로 마운트됨</text>

  <rect x="808" y="208" width="110" height="36" rx="18" fill="#1e293b"/>
  <text x="863" y="231" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">프로세스</text>
  <line x1="808" y1="226" x2="782" y2="226" stroke="#1e293b" stroke-width="2" marker-end="url(#a-dark)"/>
  <text x="863" y="270" font-size="12" fill="#15803d" text-anchor="middle">탈옥을 시도해도</text>
  <text x="863" y="288" font-size="12" fill="#15803d" text-anchor="middle">루트는 new_root</text>

  <text x="500" y="372" font-size="14" font-weight="700" fill="#15803d">✓ 루트 파일시스템 자체가 바뀜 → 탈옥 불가</text>
  <text x="500" y="396" font-size="13" fill="#64748b">마운트 격리로 호스트에는 영향이 가지 않음</text>
</svg>
